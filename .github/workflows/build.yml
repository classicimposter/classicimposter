name: Webseite & Android-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Webseite veröffentlichen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: www nach gh-pages kopieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r www /tmp/site && touch /tmp/site/.nojekyll
          git fetch origin gh-pages || true
          if git rev-parse --verify -q origin/gh-pages; then git checkout -B gh-pages origin/gh-pages; else git checkout --orphan gh-pages; fi
          git rm -rq . || true
          git clean -fdq
          cp -r /tmp/site/. .
          git add -A
          git diff --cached --quiet || (git commit -m "Update website from ${GITHUB_SHA::7}" && git push origin gh-pages)

  apk:
    name: Android-APK bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets
          npx cap sync android
          cp android-overrides/MainActivity.java android/app/src/main/java/com/imposter/partygame/MainActivity.java
          # Hochformat erzwingen und Tastatur sauber einblenden
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait" android:windowSoftInputMode="adjustResize"/' android/app/src/main/AndroidManifest.xml
          grep -n "MainActivity" android/app/src/main/AndroidManifest.xml
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../imposter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: imposter-apk
          path: imposter.apk
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Classic Imposter v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            🎮 Classic Imposter – Partyspiel für Android.
            APK herunterladen, auf dem Handy öffnen und „Installation aus unbekannten Quellen“ erlauben.
          files: imposter.apk
